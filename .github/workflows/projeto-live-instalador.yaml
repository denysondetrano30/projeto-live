# Projeto Live: monta o instalador do Windows (OBS do Projeto Live + app de projeção).
#
# Roda depois de cada compilação do OBS que passou ("Push" no master) e também na mão (aba Actions >
# "Projeto Live: instalador" > Run workflow). Pega o OBS do pacote da compilação e compila o app de
# projeção a partir do repositório projeto-live-projecao (público). O instalador sai como artifact
# "ProjetoLive-Instalador-<commit>" e também na página Releases, que baixa sem login:
# https://github.com/denysondetrano30/projeto-live/releases/download/33.0.1-projetolive/ProjetoLive-Instalador.exe
#
# A etiqueta (tag) da Release TEM de ter a cara de uma versão (33.0.1-...), porque o CMake do OBS
# descobre a versão com "git describe --tags": uma etiqueta como "teste" quebra a compilação
# ("list index 1 out of range" em cmake/common/versionconfig.cmake).
name: "Projeto Live: instalador"
on:
  workflow_run:
    workflows: [Push]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  installer:
    name: Instalador do Windows
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2022
    steps:
      - name: Código do instalador
        uses: actions/checkout@v5
        with:
          sparse-checkout: installer

      - name: Qual compilação do OBS usar
        id: obs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A compilação mais nova do master que tem o pacote do Windows pronto. Não exige que a
          # compilação inteira tenha passado: o pacote do Windows é feito num trabalho só dele, e
          # uma falha do Mac (ou um trabalho cancelado por um envio novo) não estraga o Windows.
          # Envios que só mudam o instalador não compilam o OBS de novo, por isso a busca.
          run_id=""
          sha=""
          for candidate in $(gh api "repos/${{ github.repository }}/actions/workflows/push.yaml/runs?branch=master&per_page=30" --jq '.workflow_runs[] | "\(.id):\(.head_sha)"'); do
            id="${candidate%%:*}"
            found=$(gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts?per_page=100" --jq '[.artifacts[] | select(.name | startswith("obs-studio-windows-x64-")) | select(.expired | not)] | length')
            if [ "$found" != "0" ]; then
              run_id="$id"
              sha="${candidate#*:}"
              break
            fi
          done
          if [ -z "$run_id" ]; then
            echo "Nenhuma compilação do OBS com pacote do Windows encontrada"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "short=${sha::9}" >> "$GITHUB_OUTPUT"
          echo "OBS: compilação $run_id (commit ${sha::9})"

      - name: Baixa o OBS
        uses: actions/download-artifact@v4
        with:
          pattern: obs-studio-windows-x64-*
          run-id: ${{ steps.obs.outputs.run_id }}
          github-token: ${{ github.token }}
          path: download/obs

      - name: Descompacta o OBS
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Recurse download/obs -Filter "obs-studio-*-windows-x64.zip" |
            Where-Object { $_.Name -notmatch "PDBs" } | Select-Object -First 1
          if (-not $zip) { throw "Pacote do OBS não encontrado" }
          Expand-Archive $zip.FullName -DestinationPath installer/stage/obs -Force
          if (-not (Test-Path installer/stage/obs/bin/64bit/obs64.exe)) { throw "obs64.exe não está no pacote" }

      - name: Código do app de projeção
        uses: actions/checkout@v5
        with:
          repository: denysondetrano30/projeto-live-projecao
          path: projecao-src

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Compila o app de projeção (pasta pronta, sem instalador próprio)
        working-directory: projecao-src
        shell: bash
        run: |
          npm ci
          npm run build
          npx electron-builder --config config/building/electron-builder.local.yaml --win dir --x64 --publish never
          test -f dist/win-unpacked/FreeShow.exe
          mkdir -p ../installer/stage/projecao
          cp -r dist/win-unpacked/. ../installer/stage/projecao/

      - name: Monta o instalador
        shell: pwsh
        run: |
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          } else {
            $makensis = $makensis.Source
          }
          & $makensis /V2 "/DVERSION=${{ steps.obs.outputs.short }}" installer/projeto-live.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis falhou" }

      - name: Guarda o instalador
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoLive-Instalador-${{ steps.obs.outputs.short }}
          path: installer/ProjetoLive-Instalador-*.exe
          if-no-files-found: error
          compression-level: 0

      - name: Publica em Releases > teste (baixa sem login)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          Copy-Item (Get-ChildItem installer/ProjetoLive-Instalador-*.exe | Select-Object -First 1).FullName installer/ProjetoLive-Instalador.exe
          $tag = "33.0.1-projetolive"
          $notes = "Instalador de teste do Projeto Live (OBS + app de projecao). Compilacao ${{ steps.obs.outputs.short }}."
          gh release view $tag -R $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag -R $repo --prerelease --target master --title "Projeto Live (teste)" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "nao deu para criar a release" }
          } else {
            gh release edit $tag -R $repo --notes $notes
          }
          gh release upload $tag installer/ProjetoLive-Instalador.exe -R $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "nao deu para enviar o instalador" }
